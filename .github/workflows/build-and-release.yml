name: Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Read Mod Version
        id: get_version
        run: |
          VERSION=$(grep "^mod_version=" gradle.properties | cut -d'=' -f2 | tr -d ' \r')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Mod with Gradle
        run: gradle build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: connecto-${{ steps.get_version.outputs.version }}
          path: build/libs/*.jar

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: Connecto v${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          files: |
            build/libs/connecto-${{ steps.get_version.outputs.version }}.jar
          body: |
            ## Connecto v${{ steps.get_version.outputs.version }} Release
            
            Fabric Server Mod for Minecraft 26.1.2.
            
            ### Installation
            1. Download `connecto-${{ steps.get_version.outputs.version }}.jar`.
            2. Place it in your server's `mods/` directory.
            3. Configure `config/connecto.json` with `"enabled": true` and add your whitelisted usernames.
            4. Restart the server.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
