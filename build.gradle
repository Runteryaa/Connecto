task decompileOpCommand {
    doLast {
        def urls = configurations.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def urlClassLoader = new URLClassLoader(urls, this.class.classLoader)
        try {
            def is = urlClassLoader.getResourceAsStream("net/minecraft/server/commands/OpCommand.class")
            def bytes = is.bytes
            new File("OpCommand.class").bytes = bytes
        } catch (Exception e) {
            e.printStackTrace()
        }
    }
}
