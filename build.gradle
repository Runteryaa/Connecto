plugins {
    id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
    id 'maven-publish'
}

version = project.mod_version
group   = project.maven_group

base {
    archivesName = project.archives_base_name
}

repositories {
    // Fabric maven is registered by the loom plugin automatically
}

dependencies {
    // Minecraft & Fabric Loader
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Gson is bundled with Minecraft already; no extra dep needed
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}
task printMethods {
    doLast {
        def urls = configurations.compileClasspath.files.collect { it.toURI().toURL() } as URL[]
        def urlClassLoader = new URLClassLoader(urls, this.class.classLoader)
        try {
            def clazz = urlClassLoader.loadClass("net.minecraft.commands.CommandSourceStack")
            clazz.methods.findAll { it.name.toLowerCase().contains("perm") }.each {
                println "METHOD: " + it.name + " " + it.parameterTypes
            }
        } catch (Exception e) {
            e.printStackTrace()
        }
    }
}
